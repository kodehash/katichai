name: Sync Release to Public Repo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g., v1.0.0-alpha.6)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Setup GitHub CLI
        run: |
          gh --version

      - name: Extract tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          
          if [ -z "$TAG" ]; then
            echo "Error: Tag is required"
            exit 1
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted tag: $TAG"

      - name: Get release information
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          
          # Get release information
          RELEASE_INFO=$(gh release view "$TAG" --repo ${{ github.repository }} --json name,body,isPrerelease)
          
          if [ -z "$RELEASE_INFO" ] || [ "$RELEASE_INFO" == "null" ]; then
            echo "Error: Could not fetch release information for tag $TAG"
            echo "Make sure the release exists in ${{ github.repository }}"
            exit 1
          fi
          
          TITLE=$(echo "$RELEASE_INFO" | jq -r '.name // ""')
          NOTES=$(echo "$RELEASE_INFO" | jq -r '.body // ""')
          IS_PRERELEASE=$(echo "$RELEASE_INFO" | jq -r '.isPrerelease // false')
          
          # Use tag as fallback title if name is empty
          if [ -z "$TITLE" ]; then
            TITLE="$TAG"
          fi
          
          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "Release title: $TITLE"
          echo "Is prerelease: $IS_PRERELEASE"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p ./artifacts
          
          echo "Downloading assets for tag $TAG from ${{ github.repository }}..."
          
          # Try to download assets, but don't fail if there are none
          if gh release download "$TAG" --repo ${{ github.repository }} -D ./artifacts 2>&1; then
            echo "Assets downloaded successfully"
          else
            echo "Warning: Failed to download assets or no assets found in release $TAG"
          fi
          
          if [ ! "$(ls -A ./artifacts 2>/dev/null)" ]; then
            echo "Warning: No assets found in release $TAG"
          else
            echo "Downloaded assets:"
            ls -lh ./artifacts/
          fi

      - name: Create release in target repository
        env:
          GH_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          TARGET_OWNER: ${{ secrets.SYNC_REPO_OWNER }}
          TARGET_REPO: ${{ secrets.SYNC_REPO_NAME }}
        run: |
          # Validate required environment variables
          if [ -z "$GH_TOKEN" ]; then
            echo "Error: GH_TOKEN is not set. Please configure SYNC_REPO_TOKEN secret."
            exit 1
          fi
          
          if [ -z "$TARGET_OWNER" ] || [ -z "$TARGET_REPO" ]; then
            echo "Error: TARGET_OWNER or TARGET_REPO is not set. Please configure secrets."
            exit 1
          fi
          
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.release-info.outputs.title }}"
          NOTES="${{ steps.release-info.outputs.notes }}"
          IS_PRERELEASE="${{ steps.release-info.outputs.is_prerelease }}"
          
          echo "Creating release $TAG in $TARGET_OWNER/$TARGET_REPO"
          
          # Authenticate GitHub CLI explicitly
          echo "$GH_TOKEN" | gh auth login --with-token 2>/dev/null || true
          
          # Check if release already exists
          if gh release view "$TAG" --repo "$TARGET_OWNER/$TARGET_REPO" &>/dev/null; then
            echo "Release $TAG already exists, skipping creation..."
          else
            echo "Creating new release..."
            if ! gh release create "$TAG" \
              --repo "$TARGET_OWNER/$TARGET_REPO" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease="$IS_PRERELEASE"; then
              echo "Error: Failed to create release $TAG in $TARGET_OWNER/$TARGET_REPO"
              exit 1
            fi
            echo "Release created successfully"
          fi

      - name: Upload binaries and checksums to target release
        env:
          GH_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          TARGET_OWNER: ${{ secrets.SYNC_REPO_OWNER }}
          TARGET_REPO: ${{ secrets.SYNC_REPO_NAME }}
        run: |
          # Authenticate GitHub CLI explicitly
          echo "$GH_TOKEN" | gh auth login --with-token 2>/dev/null || true
          
          TAG="${{ steps.tag.outputs.tag }}"
          
          echo "Uploading artifacts to $TARGET_OWNER/$TARGET_REPO..."
          
          # Check if artifacts directory exists and has files
          if [ ! -d "./artifacts" ] || [ -z "$(ls -A ./artifacts)" ]; then
            echo "No artifacts to upload"
            exit 0
          fi
          
          # Upload all artifacts (binaries and checksums)
          UPLOAD_COUNT=0
          for file in ./artifacts/*; do
            if [ -f "$file" ]; then
              echo "Uploading $(basename $file)..."
              if gh release upload "$TAG" "$file" --repo "$TARGET_OWNER/$TARGET_REPO" --clobber; then
                UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
                echo "✅ Successfully uploaded $(basename $file)"
              else
                echo "⚠️  Failed to upload $(basename $file)"
              fi
            fi
          done
          
          echo "Uploaded $UPLOAD_COUNT file(s)"

      - name: Push USAGE.md to target repository main branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          TARGET_OWNER: ${{ secrets.SYNC_REPO_OWNER }}
          TARGET_REPO: ${{ secrets.SYNC_REPO_NAME }}
        run: |
          if [ ! -f "USAGE.md" ]; then
            echo "Warning: USAGE.md not found in repository root"
            exit 0
          fi
          
          echo "Pushing USAGE.md to $TARGET_OWNER/$TARGET_REPO main branch..."
          
          # Clone the target repository
          git clone "https://$GH_TOKEN@github.com/$TARGET_OWNER/$TARGET_REPO.git" target-repo
          cd target-repo
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure we're on main branch
          git checkout main || git checkout -b main
          
          # Copy USAGE.md
          cp ../USAGE.md .
          
          # Check if there are changes
          if git diff --quiet USAGE.md; then
            echo "No changes to USAGE.md"
          else
            echo "Changes detected, committing..."
            git add USAGE.md
            git commit -m "Update USAGE.md from release ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
            git push "https://$GH_TOKEN@github.com/$TARGET_OWNER/$TARGET_REPO.git" main
            echo "✅ USAGE.md pushed to main branch"
          fi
          
          cd ..
          rm -rf target-repo

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SYNC_REPO_TOKEN }}
          TARGET_OWNER: ${{ secrets.SYNC_REPO_OWNER }}
          TARGET_REPO: ${{ secrets.SYNC_REPO_NAME }}
        run: |
          # Authenticate GitHub CLI explicitly
          echo "$GH_TOKEN" | gh auth login --with-token 2>/dev/null || true
          
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Verifying release $TAG in $TARGET_OWNER/$TARGET_REPO..."
          
          if gh release view "$TAG" --repo "$TARGET_OWNER/$TARGET_REPO"; then
            echo "✅ Release synced successfully!"
          else
            echo "Error: Failed to verify release $TAG in $TARGET_OWNER/$TARGET_REPO"
            exit 1
          fi
